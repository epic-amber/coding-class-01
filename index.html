<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cards-container">
        <div class="card">
            <div class="card-top">
                <h1 class="card-title">Amateur</h1>
                <p class="price"><span class="amount">Free</span></p>
                <div class="card-content">
                    <p class="includes-text">Includes:</p>
                    <ul class="features-list">
                        <li>
                            <span class="checkmark">✓</span>
                            No credit card required
                        </li>
                        <li>
                            <span class="checkmark">✓</span>
                            Limited Agent requests
                        </li>
                        <li>
                            <span class="checkmark">✓</span>
                            Limited Tab completions
                        </li>
                    </ul>
                </div>
            </div>
            <button class="download-button">Download</button>
        </div>
        <div class="card">
            <div class="card-top">
                <h1 class="card-title">Professional</h1>
                <p class="price">
                    <span class="amount">$20</span>
                    <span class="period">/mo.</span>
                </p>
                <div class="card-content">
                    <p class="includes-text">Everything in Amateur, plus:</p>
                    <ul class="features-list">
                        <li>
                            <span class="checkmark">✓</span>
                            Extended limits on Agent
                        </li>
                        <li>
                            <span class="checkmark">✓</span>
                            Unlimited Tab completions
                        </li>
                        <li>
                            <span class="checkmark">✓</span>
                            Background Agents
                        </li>
                        <li>
                            <span class="checkmark">✓</span>
                            Maximum context windows
                        </li>
                    </ul>
                </div>
            </div>
            <button class="download-button primary-button">Get Pro</button>
        </div>
    </div>
</body>
</html>
